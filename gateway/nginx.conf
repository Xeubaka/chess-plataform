# API Gateway pattern: one entry point, routes by path/prefix to whichever
# service owns that concern. Clients (and you, testing locally) never talk
# to room-service/game-service/chat-service directly — only to :8080.

events {}

http {
  server {
    listen 8080;

    location /api/rooms {
      proxy_pass http://room-service:3001/rooms;
    }

    location /api/rooms/ {
      proxy_pass http://room-service:3001/rooms/;
    }

    location /api/analysis/ {
      proxy_pass http://analysis-service:3004/rooms/;
    }

    # Trailing slash on both location and proxy_pass strips "/socket/game/"
    # before forwarding, so the socket.io client must be configured with
    # path: "/socket/game/socket.io/" (see frontend/js/*.js).
    location /socket/game/ {
      proxy_pass http://game-service:3002/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /socket/chat/ {
      proxy_pass http://chat-service:3003/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://frontend:8081;
    }
  }
}
