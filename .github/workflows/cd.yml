# Builds real tagged images, pushes to ECR, then updates Terraform's view of
# which image tag each service should run and applies it. This is the
# "CI/CD pipelines ... GitHub Actions" and "Terraform" requirements from the
# JD working together — but deploying costs real AWS money and needs
# secrets.AWS_DEPLOY_ROLE_ARN configured (see infra/terraform/README.md),
# neither of which is set up yet. Manual trigger only (Actions tab ->
# "Run workflow") so it never runs — and fails on missing credentials —
# just because something got pushed to main. Switch back to `push:` once
# you're actually ready to deploy (see docs/SCOPE.md Tier 3 — also gated on
# the AWS Terraform hardening items, which are intentionally parked for now
# in favor of free-tier hosting, per docs/FREE_TIER_HOSTING.md).
name: CD

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, frontend, room-service, game-service, chat-service, analysis-service]
    steps:
      - uses: actions/checkout@v4 # this repo: gateway/ only — everything else is its own repo now

      # Same polyrepo problem ci.yml's e2e-tests job already solves: every
      # service but gateway lives in its own github.com/Xeubaka/<name> repo
      # and won't exist in a checkout of this repo alone. Clone it into the
      # exact path the build step below expects.
      - name: Clone service source
        if: matrix.service != 'gateway'
        run: |
          dir=${{ matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          git clone --depth 1 "https://github.com/Xeubaka/${{ matrix.service }}.git" "$dir"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} # OIDC role, no long-lived keys stored in GitHub
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, push
        run: |
          dir=${{ matrix.service == 'gateway' && 'gateway' || matrix.service == 'frontend' && 'frontend' || format('services/{0}', matrix.service) }}
          repo="${{ steps.login-ecr.outputs.registry }}/chess-platform/${{ matrix.service }}"
          tag="${{ github.sha }}"
          docker build -t "$repo:$tag" "$dir"
          docker push "$repo:$tag"

  terraform-apply:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # requires manual approval in repo settings -- a real deploy gate
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # build-and-push tags every image as <registry>/chess-platform/<service>:<sha>
      # deterministically, so this job can reconstruct the same URIs rather
      # than needing matrix outputs threaded through — that's the value
      # terraform's container_images var (infra/terraform/variables.tf) needs.
      - name: Build container_images var
        id: images
        run: |
          registry="${{ steps.login-ecr.outputs.registry }}"
          tag="${{ github.sha }}"
          value="{"
          for service in gateway frontend room-service game-service chat-service analysis-service; do
            value+="${service}=\"${registry}/chess-platform/${service}:${tag}\","
          done
          value+="}"
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -var="aws_region=${{ env.AWS_REGION }}" -var="container_images=${{ steps.images.outputs.value }}"

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve -var="aws_region=${{ env.AWS_REGION }}" -var="container_images=${{ steps.images.outputs.value }}"
