# --- Automation loop example, referenced in docs/AI_DEV_LOOP.md ---
# When CI fails on main, this opens (or comments on) a tracked GitHub issue
# automatically instead of the failure just sitting in a red X nobody
# revisits. This is a small, real version of the "constantly verify for
# bugs and create tasks for solving them" loop you asked about — no AI
# model needed for this part, just automation reacting to a signal.
name: Bug Triage on CI Failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  file-issue-on-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create or update tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `CI failed on ${context.payload.workflow_run.head_branch} (${context.payload.workflow_run.head_sha.slice(0,7)})`;
            const body = [
              `CI run failed: ${context.payload.workflow_run.html_url}`,
              ``,
              `Branch: ${context.payload.workflow_run.head_branch}`,
              `Commit: ${context.payload.workflow_run.head_sha}`,
              ``,
              `This issue was filed automatically. Close it once the fix merges and CI is green again.`
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: "ci-failure",
              state: "open"
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing as of ${context.payload.workflow_run.html_url}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ci-failure", "bug"]
              });
            }
