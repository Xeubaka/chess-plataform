services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  room-service:
    build: ./services/room-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  game-service:
    build: ./services/game-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  chat-service:
    build: ./services/chat-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  analysis-service:
    build: ./services/analysis-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build: ./frontend

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - room-service
      - game-service
      - chat-service
      - analysis-service
      - frontend
