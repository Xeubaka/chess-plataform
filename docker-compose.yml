services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=chess
      - POSTGRES_PASSWORD=chess
      - POSTGRES_DB=chess
    volumes:
      - pgdata:/var/lib/postgresql/data

  room-service:
    build: ./services/room-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  game-service:
    build: ./services/game-service
    environment:
      - REDIS_URL=redis://redis:6379
      - GAME_DB_URL=postgres://chess:chess@postgres:5432/chess
    depends_on:
      - redis
      - postgres

  chat-service:
    build: ./services/chat-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  analysis-service:
    build: ./services/analysis-service
    environment:
      - REDIS_URL=redis://redis:6379
      # Leave these unset for the plain docker-compose game-service (Redis
      # pub/sub only). Only needed once game-service runs as the Cloudflare
      # Worker/Durable Object version — see docs/CLOUDFLARE.md.
      - WORKER_CALLBACK_URL=
      - ANALYSIS_SHARED_SECRET=
    depends_on:
      - redis

  # HTTP wrapper around bot.js's Stockfish integration — Stockfish can't run
  # inside a Cloudflare Worker, so the Worker (Durable Object or the
  # free-tier Upstash-backed alternative — see docs/CLOUDFLARE.md) calls
  # this over HTTP (BOT_ORIGIN) instead of running it in-process. Unused by
  # the plain docker-compose game-service; only relevant once game-service
  # is migrated.
  game-bot:
    build: ./services/game-service
    command: node src/botServer.js
    environment:
      - BOT_SHARED_SECRET=

  frontend:
    build: ./frontend

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - room-service
      - game-service
      - chat-service
      - analysis-service
      - frontend
      - game-bot

volumes:
  pgdata:
