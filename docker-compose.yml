services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=chess
      - POSTGRES_PASSWORD=chess
      - POSTGRES_DB=chess
    volumes:
      - pgdata:/var/lib/postgresql/data

  room-service:
    build: ./services/room-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  game-service:
    build: ./services/game-service
    environment:
      - REDIS_URL=redis://redis:6379
      - GAME_DB_URL=postgres://chess:chess@postgres:5432/chess
    depends_on:
      - redis
      - postgres

  chat-service:
    build: ./services/chat-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  analysis-service:
    build: ./services/analysis-service
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build: ./frontend

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    depends_on:
      - room-service
      - game-service
      - chat-service
      - analysis-service
      - frontend

volumes:
  pgdata:
